<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán - TechX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/checkout.css">
</head>
<body>

<div class="checkout-container container my-5 p-4 shadow-sm rounded bg-white">
    <h2 class="text-center mb-4 fw-bold text-primary">Thanh Toán Đơn Hàng</h2>

    <div class="row g-4">
        <!-- Form thông tin -->
        <div class="col-md-6">
            <h5 class="mb-3">Thông tin khách hàng</h5>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="name" placeholder="Nhập họ tên của bạn">
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Số điện thoại</label>
                    <input type="tel" class="form-control" id="phone" placeholder="Nhập số điện thoại">
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Địa chỉ giao hàng</label>
                    <textarea class="form-control" id="address" rows="3" placeholder="Nhập địa chỉ cụ thể"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phương thức thanh toán</label>
                    <select class="form-select">
                        <option>Thanh toán khi nhận hàng (COD)</option>
                        <option>Chuyển khoản ngân hàng</option>
                        <option>Ví MoMo</option>
                    </select>
                </div>
                <button type="button" class="btn btn-primary w-100 mt-3">Xác nhận thanh toán</button>
            </form>
        </div>

        <!-- Tóm tắt đơn hàng -->
        <div class="col-md-6">
            <h5 class="mb-3">Tóm tắt đơn hàng</h5>
            <ul class="list-group mb-3">
                <li class="list-group-item d-flex justify-content-between">
                    <span>Máy ảnh Sony A7 III</span>
                    <strong>20.000.000₫</strong>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <span>Ống kính 50mm f/1.8</span>
                    <strong>4.500.000₫</strong>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <span>Phí giao hàng</span>
                    <strong>30.000₫</strong>
                </li>
                <li class="list-group-item d-flex justify-content-between total">
                    <span>Tổng cộng</span>
                    <strong>24.530.000₫</strong>
                </li>
            </ul>
            <div class="alert alert-info small text-secondary">
                💡 Vui lòng kiểm tra kỹ thông tin trước khi thanh toán.
            </div>
        </div>
    </div>
</div>

</body>
</html>
